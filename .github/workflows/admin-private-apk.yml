name: Build Private Admin APK

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: Private administrator APK version label
        required: false
        default: 6.1-admin-private

permissions:
  contents: write

jobs:
  build-private-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare isolated administrator-only source
        env:
          ADMIN_PRIVATE_VERSION: ${{ inputs.version_label }}
        run: |
          cp -a . "$RUNNER_TEMP/admin-private-source"
          node "$RUNNER_TEMP/admin-private-source/.github/scripts/prepare-admin-private-apk.mjs" "$RUNNER_TEMP/admin-private-source/FHL_NATIVE_APP"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fhl-admin-private.keystore"
          test -s "$RUNNER_TEMP/fhl-admin-private.keystore"

      - name: Build signed private administrator APK
        working-directory: ${{ runner.temp }}/admin-private-source/FHL_NATIVE_APP
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fhl-admin-private.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Stage named APK
        run: |
          mkdir -p "$RUNNER_TEMP/admin-private-release"
          cp "$RUNNER_TEMP/admin-private-source/FHL_NATIVE_APP/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/admin-private-release/FHL_ADMIN_PRIVATE-build-${{ github.run_number }}.apk"

      - name: Upload private APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FHL_ADMIN_PRIVATE-build-${{ github.run_number }}
          path: ${{ runner.temp }}/admin-private-release/FHL_ADMIN_PRIVATE-build-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish private administrator APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-private-build-${{ github.run_number }}
          name: FHL ADMIN PRIVATE build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ${{ runner.temp }}/admin-private-release/FHL_ADMIN_PRIVATE-build-${{ github.run_number }}.apk
