name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - 'FHL_NATIVE_APP/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: FHL_NATIVE_APP

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fhl-release.keystore"
          test -s "$RUNNER_TEMP/fhl-release.keystore"

      - name: Read app version
        id: app_version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          version=$(awk -F'"' '/versionName[[:space:]]+"/{print $2; exit}' app/build.gradle)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inject runtime release identity
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RELEASE_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('app/src/main/assets/public/index.html')
          text = path.read_text()
          text = re.sub(r"const APP_VERSION = '[^']+';", "const APP_VERSION = '%s';" % os.environ['RELEASE_VERSION'], text, count=1)
          text = re.sub(r"const APP_BUILD = '[^']+';", "const APP_BUILD = '%s';" % os.environ['RELEASE_BUILD'], text, count=1)
          path.write_text(text)
          PY
          grep -nE "const APP_(VERSION|BUILD)" app/src/main/assets/public/index.html

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fhl-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FHL_ELECTRONICS-v6-release-${{ github.run_number }}
          path: FHL_NATIVE_APP/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.1-build-${{ github.run_number }}
          name: FHL ELECTRONICS v6.1 build ${{ github.run_number }}
          generate_release_notes: true
          files: FHL_NATIVE_APP/app/build/outputs/apk/release/app-release.apk

      - name: Sync release metadata to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: stock-take-9a67a
          RELEASE_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: v6.1-build-${{ github.run_number }}
          RELEASE_DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v6.1-build-${{ github.run_number }}/app-release.apk
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          node .github/scripts/update-firestore-release.mjs
