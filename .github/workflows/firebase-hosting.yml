name: Deploy FHL Electronics Website

on:
  push:
    branches: [main]
    paths:
      - 'FHL_NATIVE_APP/app/src/main/assets/public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-live-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy synchronized website to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: stock-take-9a67a
          channelId: live
          entryPoint: .
          force: true
